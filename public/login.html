<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — LearnDeck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-2xl space-y-6">
    
    <!-- Header -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-600/30">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
      </div>
      <div>
        <h1 class="text-xl font-bold text-white tracking-tight">LearnDeck</h1>
        <p class="text-xs text-slate-400">Personal Learning Library</p>
      </div>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="hidden p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-semibold flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      <span id="error-text">Invalid email or password.</span>
    </div>

    <!-- Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Authorized Email</label>
        <input type="email" id="email" required placeholder="user@domain.com" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-700 bg-slate-950 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-700 bg-slate-950 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <button type="submit" id="submit-btn" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white font-medium text-sm rounded-lg transition-all shadow-md shadow-brand-600/20">
        Sign In to Deck
      </button>
    </form>

    <div class="pt-4 border-t border-slate-800 text-center text-xs text-slate-500 flex justify-center gap-3">
      <a href="./privacy.html" class="hover:underline">Privacy Policy</a>
      <span>•</span>
      <a href="./terms.html" class="hover:underline">Terms & Conditions</a>
    </div>

  </div>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const banner = document.getElementById("error-banner");
      const errorText = document.getElementById("error-text");
      const btn = document.getElementById("submit-btn");

      banner.classList.add("hidden");
      btn.textContent = "Authenticating...";
      btn.disabled = true;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "./index.html";
      } catch (error) {
        banner.classList.remove("hidden");
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          errorText.textContent = "Incorrect email or password. Please verify credentials.";
        } else if (error.code === 'auth/too-many-requests') {
          errorText.textContent = "Access blocked temporarily due to multiple failed login attempts.";
        } else {
          errorText.textContent = error.message;
        }
        btn.textContent = "Sign In to Deck";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
