<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnDeck — Personal Learning Library</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            slate: {
              850: '#111827',
              950: '#090d16',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200 selection:bg-brand-500 selection:text-white pb-20 md:pb-6">

  <!-- MAIN APP SHELL -->
  <div id="app-shell" class="flex-1 flex flex-col max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-30 bg-slate-50/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/80 py-3.5 transition-colors">
      <div class="flex items-center justify-between gap-4">
        
        <!-- Brand Logo -->
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white shadow">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          </div>
          <span class="font-bold text-lg tracking-tight text-slate-900 dark:text-white">LearnDeck</span>
        </div>

        <!-- Toolbar -->
        <div class="flex items-center gap-2 sm:gap-3">
          
          <button id="open-add-btn" class="hidden sm:flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-lg transition-colors shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span>Add Resource</span>
          </button>

          <!-- Theme Toggle Switch -->
          <button id="theme-toggle-btn" title="Toggle Light/Dark Theme" class="p-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            <svg id="sun-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg id="moon-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>

          <!-- User Info & Sign Out -->
          <div class="flex items-center gap-2 pl-2 border-l border-slate-200 dark:border-slate-800">
            <span id="user-display" class="hidden lg:inline text-xs font-medium text-slate-500 dark:text-slate-400 max-w-[140px] truncate">Connecting...</span>
            <button id="signout-btn" title="Sign Out" class="p-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-500 hover:text-red-500 dark:text-slate-400 dark:hover:text-red-400 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
          </div>

        </div>

      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 py-6 space-y-6">
      
      <!-- Search and Sort Toolbar -->
      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
          <input type="text" id="search-input" placeholder="Search title, topic, tags..." class="w-full pl-10 pr-4 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>

        <select id="sort-select" class="px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
          <option value="recent">Recently Added</option>
          <option value="oldest">Oldest First</option>
          <option value="alpha">Alphabetical (A-Z)</option>
          <option value="watched">Recently Watched</option>
        </select>
      </div>

      <!-- Filter Navigation Tabs (Fixed Hover Text Color Issue) -->
      <div class="border-b border-slate-200 dark:border-slate-800">
        <nav class="flex space-x-2 sm:space-x-4 overflow-x-auto no-scrollbar pb-2">
          <button data-filter="all" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-md bg-brand-600 text-white">
            All <span id="count-all" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-brand-700 text-white">0</span>
          </button>
          <button data-filter="lecture" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
            Lectures <span id="count-lecture" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
          </button>
          <button data-filter="playlist" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
            Playlists <span id="count-playlist" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
          </button>
          <button data-filter="unwatched" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
            Unwatched <span id="count-unwatched" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
          </button>
          <button data-filter="watched" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
            Watched <span id="count-watched" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
          </button>
          <button data-filter="watchlist" class="tab-btn px-3 py-1.5 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
            Watchlist <span id="count-watchlist" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
          </button>
        </nav>
      </div>

      <!-- Resource Grid -->
      <div id="resource-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
        <!-- Rendered by app.js -->
      </div>

      <!-- Empty State View -->
      <div id="empty-state" class="hidden py-16 text-center border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-xl">
        <h3 class="text-sm font-semibold text-slate-900 dark:text-white mb-1">No resources found</h3>
        <p class="text-xs text-slate-500 max-w-sm mx-auto mb-4">Click '+ Add Resource' to save your first video or playlist link.</p>
        <button onclick="document.getElementById('add-modal').classList.remove('hidden')" class="px-3.5 py-2 text-xs font-medium bg-brand-600 text-white rounded-lg">
          Add Resource
        </button>
      </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto pt-6 pb-4 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 space-x-3">
      <span>Made with ❤️ by Ankit</span>
      <span>•</span>
        <a href="./privacy.html" class="hover:underline">Privacy Policy</a>
      <span>•</span>
      
      <a href="./terms.html" class="hover:underline">Terms & Conditions</a>
      
    </footer>

  </div>

  <!-- Mobile Floating Add Button -->
  <div class="fixed bottom-4 right-4 z-40 sm:hidden">
    <button id="open-add-mobile" class="p-3.5 bg-brand-600 text-white rounded-full shadow-xl">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>
  </div>

  <!-- ADD RESOURCE MODAL -->
  <div id="add-modal" class="hidden fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white dark:bg-slate-900 border-t sm:border border-slate-200 dark:border-slate-800 rounded-t-2xl sm:rounded-xl p-6 w-full max-w-lg shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      
      <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
        <h3 class="text-base font-semibold text-slate-900 dark:text-white">Add New Resource</h3>
        <button id="close-add-modal" class="text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div id="modal-error-box" class="hidden p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-medium"></div>

      <form id="add-resource-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Resource URL *</label>
          <input type="url" id="add-url" required placeholder="https://www.youtube.com/watch?v=..." class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Title *</label>
          <input type="text" id="add-title" required placeholder="e.g., Advanced System Design Lecture" class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Type</label>
            <select id="add-type" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
              <option value="Lecture">Lecture</option>
              <option value="Playlist">Playlist</option>
              <option value="Course">Course</option>
              <option value="Article">Article</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Topic / Category</label>
            <input type="text" id="add-topic" placeholder="e.g. Computer Science" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Tags (Comma separated)</label>
          <input type="text" id="add-tags" placeholder="e.g. algorithms, system design" class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Description (Optional)</label>
          <textarea id="add-description" rows="2" placeholder="Brief notes..." class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-200 dark:border-slate-800">
          <button type="button" id="cancel-add-modal" class="px-4 py-2 text-xs font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">Cancel</button>
          <button type="submit" id="save-resource-btn" class="px-4 py-2 text-xs font-medium bg-brand-600 hover:bg-brand-700 text-white rounded-lg shadow-sm">Save Resource</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 right-4 z-50 transform translate-y-[-100%] opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-lg shadow-xl flex items-center gap-2 border border-slate-800">
      <span id="toast-msg">Action performed</span>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
